<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon Shore">
<meta name="theme-color" content="#12021f">
<meta name="format-detection" content="telephone=no">
<title>Neon Shore</title>
<style>
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
--hf:"Avenir Next Condensed","Futura","Arial Narrow","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:#12021f;touch-action:none;overscroll-behavior:none;font-family:var(--hf);color:#fff}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;pointer-events:none;z-index:5}
#hud{inset:0;display:none}
#mini{position:absolute;top:calc(var(--st) + 8px);left:calc(var(--sl) + 10px);width:118px;height:118px;border-radius:18px;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 14px rgba(255,43,214,.55),inset 0 0 10px rgba(0,0,0,.6);background:#081420}
#clock{position:absolute;top:calc(var(--st) + 130px);left:calc(var(--sl) + 10px);width:118px;text-align:center;font-weight:800;font-size:15px;letter-spacing:1px;text-shadow:0 0 6px #ff2bd6,0 2px 2px #000}
#topR{position:absolute;top:calc(var(--st) + 6px);right:calc(var(--sr) + 12px);text-align:right}
#cash{font-size:30px;font-weight:900;font-style:italic;color:#7dffa8;letter-spacing:1px;text-shadow:0 0 10px rgba(60,255,140,.8),2px 2px 0 #062,3px 3px 4px #000}
#stars{font-size:22px;letter-spacing:2px;line-height:22px;margin-top:-2px}
#stars span{color:rgba(255,255,255,.18);text-shadow:0 1px 2px #000}
#stars span.on{color:#fff;text-shadow:0 0 8px #fff,0 0 2px #fff}
#stars.flash span.on{animation:fl .5s steps(2) infinite}
@keyframes fl{50%{color:rgba(255,255,255,.25);text-shadow:none}}
#hpw{width:120px;height:7px;margin:4px 0 0 auto;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.5);border-radius:4px;overflow:hidden}
#hp{height:100%;width:100%;background:linear-gradient(90deg,#3dff7a,#b8ff3d);transition:width .2s}
#hp.car{background:linear-gradient(90deg,#22e6ff,#2b8cff)}
#mission{position:absolute;top:calc(var(--st) + 8px);left:50%;transform:translateX(-50%);min-width:200px;max-width:46%;text-align:center;display:none;background:linear-gradient(180deg,rgba(20,0,35,.72),rgba(20,0,35,.45));border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:5px 12px 6px}
#mTitle{font-size:12px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#ffd84a}
#mObj{font-size:15px;font-weight:700;line-height:18px;text-shadow:0 1px 2px #000}
#mTime{font-size:20px;font-weight:900;font-style:italic;color:#fff;text-shadow:0 0 8px #ff2bd6}
#mTime.low{color:#ff4a5a;text-shadow:0 0 10px #f00}
#big{position:absolute;left:0;right:0;top:34%;text-align:center;opacity:0;transition:opacity .35s}
#bigT{font-size:56px;font-weight:900;font-style:italic;letter-spacing:2px;line-height:1;-webkit-text-stroke:2px rgba(0,0,0,.6)}
#bigS{font-size:20px;font-weight:800;margin-top:6px;letter-spacing:2px;text-shadow:0 2px 3px #000}
#toast{position:absolute;left:50%;top:calc(var(--st) + 98px);transform:translateX(-50%);font-size:18px;font-weight:900;font-style:italic;letter-spacing:2px;color:#22e6ff;text-shadow:0 0 10px #22e6ff,0 2px 2px #000;opacity:0;transition:opacity .4s;white-space:nowrap}
.btn{position:absolute;pointer-events:auto;border:2px solid rgba(255,255,255,.75);color:#fff;font-family:var(--hf);font-weight:900;font-style:italic;letter-spacing:1px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.25),rgba(30,0,50,.55));border-radius:50%;text-shadow:0 1px 2px #000;touch-action:none;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1}
.btn.down{transform:scale(.92);background:radial-gradient(circle,rgba(255,43,214,.7),rgba(60,0,80,.6))}
#bAct{width:84px;height:84px;right:calc(var(--sr) + 22px);bottom:calc(var(--sb) + 26px);font-size:15px;border-color:#ffd84a;box-shadow:0 0 14px rgba(255,216,74,.6)}
#bAct.dim{opacity:.35;box-shadow:none}
#bDrift{width:64px;height:64px;right:calc(var(--sr) + 118px);bottom:calc(var(--sb) + 18px);font-size:12px;border-color:#22e6ff;box-shadow:0 0 12px rgba(34,230,255,.5)}
#bSprint{width:64px;height:64px;right:calc(var(--sr) + 118px);bottom:calc(var(--sb) + 18px);font-size:12px;border-color:#7dffa8}
#bMute,#bRadio{position:relative;display:inline-flex;width:38px;height:38px;border-radius:12px;font-size:16px;margin-left:6px;margin-top:6px;font-style:normal}
#bRadio{width:auto;padding:0 10px;font-size:11px}
#tr .btn{position:relative}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:radial-gradient(circle,rgba(255,43,214,.12),rgba(0,0,0,.25));left:calc(var(--sl) + 40px);bottom:calc(var(--sb) + 30px);opacity:.45;pointer-events:none}
#joy.on{opacity:.95}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ff8be8 40%,#b0178f);box-shadow:0 0 14px #ff2bd6}
#help{position:absolute;bottom:calc(var(--sb) + 8px);left:50%;transform:translateX(-50%);font-size:12px;opacity:.75;text-shadow:0 1px 2px #000;white-space:nowrap}
#title{position:absolute;inset:0;z-index:20;overflow:hidden;background:#12021f;display:flex;align-items:flex-end;justify-content:center}
#tBlur{position:absolute;inset:-20px;background-size:cover;background-position:center;background-repeat:no-repeat;filter:blur(14px) brightness(.55)}
#tImg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
#tShade{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(180deg,transparent,rgba(10,0,25,.85))}
#tUI{position:relative;text-align:center;padding-bottom:calc(var(--sb) + 18px)}
#tap{font-size:30px;font-weight:900;font-style:italic;letter-spacing:4px;color:#fff;text-shadow:0 0 12px #ff2bd6,0 0 24px #ff2bd6,0 2px 2px #000;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45;transform:scale(.97)}}
#tSub{font-size:13px;margin-top:6px;letter-spacing:1px;color:#bff6ff;text-shadow:0 1px 3px #000}
#tSave{font-size:14px;margin-top:4px;color:#7dffa8;font-weight:800;text-shadow:0 1px 3px #000}
@media (orientation:portrait){#tImg{background-size:100% auto;background-position:center 34%;filter:drop-shadow(0 0 24px rgba(255,43,214,.45))}#tShade{height:35%}#tUI{padding-bottom:calc(var(--sb) + 60px)}}
#rot{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(12,0,24,.92);text-align:center;padding:30px}
#rot .ph{width:46px;height:80px;border:4px solid #fff;border-radius:10px;margin-bottom:22px;animation:rotp 2s ease-in-out infinite;box-shadow:0 0 16px #22e6ff}
@keyframes rotp{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rot h2{font-size:24px;font-style:italic;letter-spacing:1px;text-shadow:0 0 10px #ff2bd6}
#rot p{opacity:.8;margin:8px 0 22px;font-size:15px}
#rotBtn{pointer-events:auto;font-family:var(--hf);font-size:15px;font-weight:800;color:#fff;background:rgba(255,43,214,.25);border:2px solid #ff2bd6;border-radius:24px;padding:10px 22px}
@media (orientation:portrait){#bigT{font-size:44px}#mission{top:calc(var(--st) + 150px);max-width:90%}#mini{width:104px;height:104px}#clock{top:calc(var(--st) + 116px);width:104px}#joy{bottom:calc(var(--sb) + 60px)}#bAct{bottom:calc(var(--sb) + 60px)}#bDrift,#bSprint{bottom:calc(var(--sb) + 150px);right:calc(var(--sr) + 32px)}#help{display:none}#toast{top:calc(var(--st) + 160px)}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hud">
  <canvas id="mini" width="236" height="236"></canvas>
  <div id="clock">5:00 PM</div>
  <div id="mission"><div id="mTitle"></div><div id="mObj"></div><div id="mTime"></div></div>
  <div id="topR">
    <div id="cash">$0</div>
    <div id="stars"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div>
    <div id="hpw"><div id="hp"></div></div>
    <div id="tr"><button class="btn" id="bRadio">RADIO</button><button class="btn" id="bMute">♪</button></div>
  </div>
  <div id="toast"></div>
  <div id="big"><div id="bigT"></div><div id="bigS"></div></div>
  <div id="joy"><div id="knob"></div></div>
  <button class="btn" id="bAct">GET IN</button>
  <button class="btn" id="bDrift">DRIFT</button>
  <button class="btn" id="bSprint">RUN</button>
  <div id="help">Drag left side to move · Walk up to a car and tap GET IN</div>
</div>
<div id="title">
  <div id="tBlur"></div><div id="tImg"></div><div id="tShade"></div>
  <div id="tUI"><div id="tap">TAP TO START</div><div id="tSub">Open world · Missions · Cops · Synthwave radio — best in landscape with sound on</div><div id="tSave"></div></div>
</div>
<div id="rot"><div class="ph"></div><h2>Turn your phone sideways</h2><p>Neon Shore plays best in landscape.</p><button id="rotBtn">Play in portrait anyway</button></div>

(()=>{'use strict';
// ===== utils =====
const PI=Math.PI,TAU=PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hyp=Math.hypot;
function mulberry(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hash=(x,y)=>{let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;};
const hexRgb=h=>{h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const shade=(hex,f)=>{const c=hexRgb(hex);return`rgb(${clamp(c[0]*f,0,255)|0},${clamp(c[1]*f,0,255)|0},${clamp(c[2]*f,0,255)|0})`;};
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}

// ===== world =====
const T=40,BP=9,NBX=7,NBY=7,OX=5,OY=5;
const CW=NBX*BP+2,CH=NBY*BP+2;
const BEACH=9,SEA=12;
const MW=OX+CW+BEACH+SEA,MH=OY+CH+OY;
const WORLD_W=MW*T,WORLD_H=MH*T;
const WATER=0,SAND=1,ROAD=2,WALK=3,LOT=4,BLD=5,GRASS=6,PARK=7;
const map=new Uint8Array(MW*MH);
const depth=new Uint8Array(MW*MH);
const tileAt=(x,y)=>(x<0||y<0||x>=MW||y>=MH)?WATER:map[y*MW+x];
const tileW=(wx,wy)=>tileAt(Math.floor(wx/T),Math.floor(wy/T));
const solidCar=t=>t===BLD||t===WATER;
const solidPed=t=>t===BLD||t===WATER;
const pedWalk=t=>t===WALK||t===LOT||t===GRASS||t===SAND;
const LANE=20;
const K3D=0.0021;

const buildings=[],palms=[],lamps=[],decor=[],parkSpots=[],cashSpots=[];
const nodes=[];const NN=8;
const SIGNS=['MOTEL','CLUB AZUL','PALMS','TACOS','HOTEL ROSA','ARCADE','SURF','DINER','LOUNGE','VIBES','24/7','PIZZA','GYM','DISCO','SUSHI','RADIO','CAFE','JUICE','TATTOO','BOWL','NEON','CINEMA','BEACH CLUB','SUNSET'];
const WALLS=['#f7a8c4','#9ee6cf','#ffc79a','#c6a8f7','#a8d8f7','#f2efe6','#ffd6e8','#b8f0e0','#f7d08a','#e6b3ff','#8fd3ff','#ff9f9f'];
const NEONS=['#ff2bd6','#22e6ff','#ffe14a','#7cff4a','#ff6a2b','#b84aff','#ff3b6b','#3bffd0'];
const lotOrigin=(bx,by)=>[OX+bx*BP+3,OY+by*BP+3];
let SPAWN={x:0,y:0};

function genWorld(){
  const R=mulberry(1337);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const cx=x-OX,cy=y-OY;let t=WATER;

    if(cx>=0&&cy>=0&&cx<CW&&cy<CH){const mx=cx%BP,my=cy%BP;
      if(mx<2||my<2)t=ROAD;else if(mx===2||mx===8||my===2||my===8)t=WALK;else t=LOT;}
    const shore=CW+BEACH+Math.round(Math.sin(y*0.27)*1.4+Math.sin(y*0.09)*1.2);
    if(cx>=CW&&cx<shore&&cy>=-2&&cy<=CH+1)t=(cx===CW&&cy>=0&&cy<CH)?WALK:SAND;
    map[y*MW+x]=t;
  }
  // water depth
  const q=[];for(let i=0;i<MW*MH;i++){if(map[i]!==WATER){depth[i]=0;q.push(i);}else depth[i]=255;}
  for(let h=0;h<q.length;h++){const i=q[h],x=i%MW,y=(i/MW)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;const j=ny*MW+nx;if(depth[j]===255){depth[j]=Math.min(254,depth[i]+1);q.push(j);}}}
  // nodes
  for(let j=0;j<NN;j++)for(let i=0;i<NN;i++)nodes.push({i,j,x:(OX+i*BP+1)*T,y:(OY+j*BP+1)*T,nb:[]});
  for(const n of nodes){for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const a=n.i+dx,b=n.j+dy;if(a>=0&&b>=0&&a<NN&&b<NN)n.nb.push(b*NN+a);}}

  for(let by=0;by<NBY;by++)for(let bx=0;bx<NBX;bx++){
    const[lx,ly]=lotOrigin(bx,by);let type;
    const r=R();
    if(bx===6)type=(by===3)?'plaza':'hotel';
    else if(bx===3&&by===3)type='park';
    else type=r<0.62?'bld':r<0.76?'park':r<0.89?'parking':'plaza';
    const setLot=(t)=>{for(let y=0;y<5;y++)for(let x=0;x<5;x++)map[(ly+y)*MW+lx+x]=t;};
    if(type==='park'){setLot(GRASS);
      for(let k=0;k<7;k++)palms.push({x:(lx+0.5+R()*4)*T,y:(ly+0.5+R()*4)*T,h:55+R()*30,s:R()*TAU,sz:0.9+R()*0.4});
      map[(ly+2)*MW+lx+2]=LOT;decor.push({t:'fountain',x:(lx+2.5)*T,y:(ly+2.5)*T});

    }else if(type==='parking'){setLot(PARK);
      for(let row=0;row<2;row++)for(let k=0;k<5;k++){parkSpots.push({x:(lx+0.5+k)*T,y:(ly+(row?3.9:1.1))*T,a:row?-PI/2:PI/2});}
      for(let x=0;x<5;x++)map[(ly+2)*MW+lx+x]=PARK;
    }else if(type==='plaza'){setLot(LOT);decor.push({t:'fountain',x:(lx+2.5)*T,y:(ly+2.5)*T});
      for(const[a,b]of[[0.6,0.6],[4.4,0.6],[0.6,4.4],[4.4,4.4]])palms.push({x:(lx+a)*T,y:(ly+b)*T,h:60+R()*25,s:R()*TAU,sz:1});
    }else{
      setLot(LOT);
      const lay=type==='hotel'?(R()<0.5?[[0,0,5,5]]:[[0,0,5,2],[0,3,5,2]]):pick2(R,[
        [[0,0,5,5]],[[0,0,5,2],[0,3,5,2]],[[0,0,2,5],[3,0,2,5]],[[0,0,2,2],[3,0,2,2],[0,3,2,2],[3,3,2,2]],[[0,0,5,3]],[[0,0,3,3],[4,0,1,5],[0,4,3,1]].slice(0,1).concat([[0,4,5,1]])]);
      for(const[x0,y0,w,h]of lay){

function makePed(x,y){const d=pick([[1,0],[-1,0],[0,1],[0,-1]]);const p={x,y,dx:d[0],dy:d[1],sp:rnd(26,42),state:'walk',t:0,phase:rnd(TAU),

        if(!c.reverse&&Math.abs(vf)<14){c.pStuck=(c.pStuck||0)+dt;if(c.pStuck>0.6){c.pRevT=0.9;c.reverse=true;c.pStuck=0;}}else c.pStuck=0;
        if(c.pRevT>0){c.pRevT-=dt;if(c.pRevT<=0&&Math.abs(d)<2.35)c.reverse=false;}
        if(c.reverse){const e=angDiff(h+PI,c.a);c.steer=-clamp(e*2.2,-1,1);c.thr=-Math.min(1,m*1.2);}
        else{c.steer=clamp(d*2.3,-1,1);c.thr=Math.abs(d)>1.9&&vf>60?-0.6:Math.min(1,m*1.25)*(Math.abs(d)>1.2?0.55:1);}}
      else{c.steer=0;c.thr=0;}c.hb=hb;}
    player.x=c.x;player.y=c.y;player.vx=c.vx;player.vy=c.vy;player.a=c.a;
  }else{let mx=iv.x,my=iv.y;if(iv.kx||iv.ky){mx=iv.kx;my=iv.ky;const l=hyp(mx,my);mx/=l;my/=l;if(!keys.ShiftLeft){mx*=0.75;my*=0.75;}}
    const m=Math.min(1,hyp(mx,my));let sp=0;if(m>0.08){sp=lerp(55,150,m)*(btn.sprint||keys.ShiftLeft?1.3:1);player.a+=angDiff(Math.atan2(my,mx),player.a)*Math.min(1,dt*14);}
    player.vx=m>0.08?mx/m*sp:0;player.vy=m>0.08?my/m*sp:0;player.x+=player.vx*dt;player.y+=player.vy*dt;player.spd=sp;player.phase+=sp*dt*0.12;
    const q=pushOut(player,6,solidPed);if(q){player.x+=q.x;player.y+=q.y;}if(player.hp<100)player.hp=Math.min(100,player.hp+dt*2);}
  if(player.hurtT>0)player.hurtT-=dt;}
function update(dt){
  G.time+=dt;G.hour=(G.hour+dt/22)%24;
  if(G.state==='play'||G.state==='dead'){
    if(G.state==='play')updatePlayer(dt);else{if(player.car){player.car.thr=0;player.car.steer=0;player.car.hb=true;}G.deadT+=dt/G.slow;if(G.deadT>4.1)respawn();}
    for(const c of cars){if(c!==player.car&&c.driver&&!c.dead){if(c.type==='police')policeAI(c,dt);else if(c.ai==='flee')trafficAI(c,dt,true);else if(c.ai==='traffic')trafficAI(c,dt,false);}
      else if(c!==player.car){c.thr=0;c.steer=0;c.hb=true;}
      if(c.horn>0){if(c.horn>0.25&&!c._honk&&onScreen(c.x,c.y,0)){SFX.horn();c._honk=1;}c.horn-=dt;if(c.horn<=0)c._honk=0;}}
    const sub=dt>1/50?2:1;for(let s=0;s<sub;s++){for(const c of cars)carPhysics(c,dt/sub);carPairs();}
    if(player.car){player.x=player.car.x;player.y=player.car.y;}
    for(const p of peds)pedUpdate(p,dt);peopleVsCars();
    for(let i=cars.length-1;i>=0;i--){const c=cars[i];if(c.x<-200||c.y<-200||c.x>WORLD_W+200||c.y>WORLD_H+200){if(c===player.car)exitCar();cars.splice(i,1);}}
    if(G.state==='play'){wantedUpdate(dt);missionUpdate(dt);
      for(const s of cashSpots){if(s.t>0){s.t-=dt;continue;}if(hyp(P().x-s.x,P().y-s.y)<20){s.t=90;G.cash+=s.v;SFX.cash();floatText(s.x,s.y,'+$'+s.v,'#7dffa8');}}}
    spawning(dt);
  }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;const fr=p.type==='spark'?3:p.type==='fire'?2.5:1.2;p.vx*=Math.exp(-fr*dt);p.vy*=Math.exp(-fr*dt);}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=dt;f.y-=dt*30;if(f.life<=0)floats.splice(i,1);}
  // camera
  const p=P(),pc=player.car,sp=pc?carSpeed(pc):0;const look=pc?0.32:0.15;const tx=p.x+(pc?pc.vx:player.vx)*look,ty=p.y+(pc?pc.vy:player.vy)*look;
  if(G.state!=='title'){const k=1-Math.exp(-dt*5);cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;}
  const tz=pc?lerp(1.0,0.74,clamp(sp/420,0,1)):1.5;cam.z+=(tz-cam.z)*(1-Math.exp(-dt*1.6));S=BASE*cam.z;cam.vw=W/S;cam.vh=H/S;
  G.shake*=Math.exp(-dt*7);cam.sx=(Math.random()-0.5)*G.shake;cam.sy=(Math.random()-0.5)*G.shake;if(G.flash>0)G.flash=Math.max(0,G.flash-dt*1.6);
  if(bannerT>0){bannerT-=dt/(G.state==='dead'?G.slow:1);if(bannerT<=0)document.getElementById('big').style.opacity=0;}
  if(toastT>0){toastT-=dt;if(toastT<=0)document.getElementById('toast').style.opacity=0;}
  G.saveT+=dt;if(G.saveT>10){G.saveT=0;save();}
}
// ===== HUD =====
const $=id=>document.getElementById(id);let hudT=0,lastHud={};
function hud(dt){hudT-=dt;if(hudT>0)return;hudT=0.1;drawMini();
  const set=(k,v,fn)=>{if(lastHud[k]!==v){lastHud[k]=v;fn(v);}};
  set('cash','$'+G.cash.toLocaleString(),v=>$('cash').textContent=v);
  set('stars',G.wanted+'|'+(G.lostT>1.2),()=>{const sp=$('stars').children;for(let i=0;i<5;i++)sp[i].className=i<G.wanted?'on':'';$('stars').classList.toggle('flash',G.lostT>1.2&&G.wanted>0);});
  const pc=player.car;const hpv=pc?Math.round(pc.hp/pc.ct.hp*100):Math.round(player.hp);set('hp',hpv+'|'+!!pc,()=>{$('hp').style.width=hpv+'%';$('hp').className=pc?'car':'';});
  const h=Math.floor(G.hour),mi=Math.floor((G.hour-h)*60);set('clock',`${(h%12)||12}:${String(mi).padStart(2,'0')} ${h<12?'AM':'PM'}`,v=>$('clock').textContent=v);
  const M=G.mission;set('mv',!!M,v=>$('mission').style.display=v?'block':'none');
  if(M){set('mt',M.def.name,v=>{$('mTitle').textContent=v;$('mTitle').style.color=M.def.col;});set('mo',M.obj,v=>$('mObj').textContent=v);
    const left=M.limit?Math.max(0,M.limit-M.t):-1;set('mtime',left<0?'':(Math.floor(left/60)+':'+String(Math.floor(left%60)).padStart(2,'0')),v=>$('mTime').textContent=v);set('mlow',left>=0&&left<10,v=>$('mTime').classList.toggle('low',v));}
  const near=!pc&&nearestCar(46);set('act',pc?'GET OUT':near?(near.driver?'JACK':'GET IN'):'GET IN',v=>$('bAct').textContent=v);set('actdim',!pc&&!near,v=>$('bAct').classList.toggle('dim',v));
  set('drift',!!pc,v=>{$('bDrift').style.display=v?'flex':'none';$('bSprint').style.display=v?'none':'flex';});
  set('help',G.time>25||!!pc,v=>$('help').style.display=v?'none':'');
}
// ===== loop =====
let last=performance.now(),acc=0,frames=0,slowF=0;
function loop(now){requestAnimationFrame(loop);let dt=Math.min(0.05,(now-last)/1000);last=now;if(dt<=0)return;
  frames++;acc+=dt;if(acc>2){const fps=frames/acc;if(fps<38&&DPRMAX>1.2&&G.state==="play"&&!window.__noAdapt){slowF++;if(slowF>=2){DPRMAX=Math.max(1,DPRMAX-0.5);resize();slowF=0;}}else slowF=0;frames=0;acc=0;}
  try{update(dt*(G.state==='dead'?G.slow:1));render();if(G.state!=='title'){hud(dt);audioUpdate();}}catch(e){console.error(e);window.__err=(window.__err||[]).concat(String(e&&e.stack||e));}}
// ===== start =====
function checkRotate(){const r=$('rot');r.style.display=(G.state!=='title'&&H>W&&!G.portraitOk)?'flex':'none';}
$('rotBtn').addEventListener('click',()=>{G.portraitOk=true;checkRotate();});
function startGame(){if(G.state!=='title')return;audioInit();G.state='play';$('title').style.display='none';$('hud').style.display='block';Radio.apply();checkRotate();
  banner('NEON SHORE','Find the colored job markers on your map',2.8,'#ff2bd6');$('bRadio').textContent=STATIONS[Radio.idx].name.split(' ')[0];setMute(AU.muted);}
$('title').addEventListener('pointerup',e=>{e.preventDefault();startGame();});
addEventListener('resize',()=>{resize();checkRotate();});addEventListener('orientationchange',()=>setTimeout(()=>{resize();checkRotate();},250));
function init(){const t=window.TITLE_ART;$('tImg').style.backgroundImage=`url(${t})`;$('tBlur').style.backgroundImage=`url(${t})`;
  genWorld();makeAssets();makeMini();resize();const had=load();
  if(had)$('tSave').textContent=`Continue · $${G.cash.toLocaleString()} · ${Object.keys(G.done).length}/5 jobs done`;
  player.x=SPAWN.x;player.y=SPAWN.y;player.a=PI;cam.x=player.x;cam.y=player.y;
  const home=makeCar('sports',(OX+64.5)*T,SPAWN.y-20,-PI/2,{color:'#ff2b4a',parked:true});home.hb=true;
  makeCar('convert',(OX+63.5)*T,SPAWN.y+90,PI/2,{color:'#7dffd8',parked:true}).hb=true;
  placeParked();for(let i=0;i<14;i++)spawnCar(pick(['sedan','taxi','sports','convert','muscle','van','sedan']),'traffic',150,1100);
  for(let i=0;i<400;i++){const x=OX+ri(0,CW+1),y=OY+ri(0,CH);if(peds.length<30&&tileAt(x,y)===WALK&&hyp((x+0.5)*T-player.x,(y+0.5)*T-player.y)<900)makePed((x+0.5)*T,(y+0.5)*T);}
  requestAnimationFrame(loop);}
window.NS={G,player,cars,peds,cam,MISSIONS,nodes,startMission,addWanted,enterCar,exitCar,nearestCar,startGame,die,respawn,spawnCar,makeCar,keys,joy,
  setHour:h=>{G.hour=h;},tp:(x,y)=>{if(player.car){player.car.x=x;player.car.y=y;}else{player.x=x;player.y=y;}cam.x=x;cam.y=y;},act:()=>{actQueued=true;},SPAWN:()=>SPAWN,T,OX,OY,BP};
init();

})();
