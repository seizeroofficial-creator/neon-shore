<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon Shore">
<meta name="theme-color" content="#12021f">
<meta name="format-detection" content="telephone=no">
<title>Neon Shore 3D</title>
<style>
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
--hf:"Avenir Next Condensed","Futura","Arial Narrow","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:#12021f;touch-action:none;overscroll-behavior:none;font-family:var(--hf);color:#fff}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;pointer-events:none;z-index:5}
#hud{inset:0;display:none}
#mini{position:absolute;top:calc(var(--st) + 8px);left:calc(var(--sl) + 10px);width:118px;height:118px;border-radius:18px;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 14px rgba(255,43,214,.55),inset 0 0 10px rgba(0,0,0,.6);background:#081420}
#clock{position:absolute;top:calc(var(--st) + 130px);left:calc(var(--sl) + 10px);width:118px;text-align:center;font-weight:800;font-size:15px;letter-spacing:1px;text-shadow:0 0 6px #ff2bd6,0 2px 2px #000}
#topR{position:absolute;top:calc(var(--st) + 6px);right:calc(var(--sr) + 12px);text-align:right}
#cash{font-size:30px;font-weight:900;font-style:italic;color:#7dffa8;letter-spacing:1px;text-shadow:0 0 10px rgba(60,255,140,.8),2px 2px 0 #062,3px 3px 4px #000}
#stars{font-size:22px;letter-spacing:2px;line-height:22px;margin-top:-2px}
#stars span{color:rgba(255,255,255,.18);text-shadow:0 1px 2px #000}
#stars span.on{color:#fff;text-shadow:0 0 8px #fff,0 0 2px #fff}
#stars.flash span.on{animation:fl .5s steps(2) infinite}
@keyframes fl{50%{color:rgba(255,255,255,.25);text-shadow:none}}
#hpw{width:120px;height:7px;margin:4px 0 0 auto;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.5);border-radius:4px;overflow:hidden}
#hp{height:100%;width:100%;background:linear-gradient(90deg,#3dff7a,#b8ff3d);transition:width .2s}
#hp.car{background:linear-gradient(90deg,#22e6ff,#2b8cff)}
#mission{position:absolute;top:calc(var(--st) + 8px);left:50%;transform:translateX(-50%);min-width:200px;max-width:46%;text-align:center;display:none;background:linear-gradient(180deg,rgba(20,0,35,.72),rgba(20,0,35,.45));border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:5px 12px 6px}
#mTitle{font-size:12px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#ffd84a}
#mObj{font-size:15px;font-weight:700;line-height:18px;text-shadow:0 1px 2px #000}
#mTime{font-size:20px;font-weight:900;font-style:italic;color:#fff;text-shadow:0 0 8px #ff2bd6}
#mTime.low{color:#ff4a5a;text-shadow:0 0 10px #f00}
#big{position:absolute;left:0;right:0;top:34%;text-align:center;opacity:0;transition:opacity .35s}
#bigT{font-size:56px;font-weight:900;font-style:italic;letter-spacing:2px;line-height:1;-webkit-text-stroke:2px rgba(0,0,0,.6)}
#bigS{font-size:20px;font-weight:800;margin-top:6px;letter-spacing:2px;text-shadow:0 2px 3px #000}
#toast{position:absolute;left:50%;top:calc(var(--st) + 98px);transform:translateX(-50%);font-size:18px;font-weight:900;font-style:italic;letter-spacing:2px;color:#22e6ff;text-shadow:0 0 10px #22e6ff,0 2px 2px #000;opacity:0;transition:opacity .4s;white-space:nowrap}
.btn{position:absolute;pointer-events:auto;border:2px solid rgba(255,255,255,.75);color:#fff;font-family:var(--hf);font-weight:900;font-style:italic;letter-spacing:1px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.25),rgba(30,0,50,.55));border-radius:50%;text-shadow:0 1px 2px #000;touch-action:none;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1}
.btn.down{transform:scale(.92);background:radial-gradient(circle,rgba(255,43,214,.7),rgba(60,0,80,.6))}
#bAct{width:84px;height:84px;right:calc(var(--sr) + 22px);bottom:calc(var(--sb) + 26px);font-size:15px;border-color:#ffd84a;box-shadow:0 0 14px rgba(255,216,74,.6)}
#bAct.dim{opacity:.35;box-shadow:none}
#bDrift{width:64px;height:64px;right:calc(var(--sr) + 118px);bottom:calc(var(--sb) + 18px);font-size:12px;border-color:#22e6ff;box-shadow:0 0 12px rgba(34,230,255,.5)}
#bSprint{width:64px;height:64px;right:calc(var(--sr) + 118px);bottom:calc(var(--sb) + 18px);font-size:12px;border-color:#7dffa8}
#bMute,#bRadio{position:relative;display:inline-flex;width:38px;height:38px;border-radius:12px;font-size:16px;margin-left:6px;margin-top:6px;font-style:normal}
#bRadio{width:auto;padding:0 10px;font-size:11px}
#tr .btn{position:relative}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:radial-gradient(circle,rgba(255,43,214,.12),rgba(0,0,0,.25));left:calc(var(--sl) + 40px);bottom:calc(var(--sb) + 30px);opacity:.45;pointer-events:none}
#joy.on{opacity:.95}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ff8be8 40%,#b0178f);box-shadow:0 0 14px #ff2bd6}
#help{position:absolute;bottom:calc(var(--sb) + 8px);left:50%;transform:translateX(-50%);font-size:12px;opacity:.75;text-shadow:0 1px 2px #000;white-space:nowrap}
#title{position:absolute;inset:0;z-index:20;overflow:hidden;background:#12021f;display:flex;align-items:flex-end;justify-content:center}
#tBlur{position:absolute;inset:-20px;background-size:cover;background-position:center;background-repeat:no-repeat;filter:blur(14px) brightness(.55)}
#tImg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
#tShade{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(180deg,transparent,rgba(10,0,25,.85))}
#tUI{position:relative;text-align:center;padding-bottom:calc(var(--sb) + 18px)}
#tap{font-size:30px;font-weight:900;font-style:italic;letter-spacing:4px;color:#fff;text-shadow:0 0 12px #ff2bd6,0 0 24px #ff2bd6,0 2px 2px #000;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45;transform:scale(.97)}}
#tSub{font-size:13px;margin-top:6px;letter-spacing:1px;color:#bff6ff;text-shadow:0 1px 3px #000}
#tSave{font-size:14px;margin-top:4px;color:#7dffa8;font-weight:800;text-shadow:0 1px 3px #000}
@media (orientation:portrait){#tImg{background-size:100% auto;background-position:center 34%;filter:drop-shadow(0 0 24px rgba(255,43,214,.45))}#tShade{height:35%}#tUI{padding-bottom:calc(var(--sb) + 60px)}}
#rot{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(12,0,24,.92);text-align:center;padding:30px}
#rot .ph{width:46px;height:80px;border:4px solid #fff;border-radius:10px;margin-bottom:22px;animation:rotp 2s ease-in-out infinite;box-shadow:0 0 16px #22e6ff}
@keyframes rotp{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rot h2{font-size:24px;font-style:italic;letter-spacing:1px;text-shadow:0 0 10px #ff2bd6}
#rot p{opacity:.8;margin:8px 0 22px;font-size:15px}
#rotBtn{pointer-events:auto;font-family:var(--hf);font-size:15px;font-weight:800;color:#fff;background:rgba(255,43,214,.25);border:2px solid #ff2bd6;border-radius:24px;padding:10px 22px}
@media (orientation:portrait){#bigT{font-size:44px}#mission{top:calc(var(--st) + 150px);max-width:90%}#mini{width:104px;height:104px}#clock{top:calc(var(--st) + 116px);width:104px}#joy{bottom:calc(var(--sb) + 60px)}#bAct{bottom:calc(var(--sb) + 60px)}#bDrift,#bSprint{bottom:calc(var(--sb) + 150px);right:calc(var(--sr) + 32px)}#help{display:none}#toast{top:calc(var(--st) + 160px)}}

.fx{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:4}
#fxVig{opacity:1;background:radial-gradient(ellipse at center,rgba(20,0,40,0) 55%,rgba(20,0,40,.38) 100%)}
#fxHurt{background:radial-gradient(circle,rgba(255,0,40,0) 40%,rgba(255,0,40,.75))}
#fxFlash{background:#fff3e0}#fxBlack{background:#000;z-index:6}
.flt{position:absolute;left:0;top:0;font-weight:900;font-style:italic;font-size:20px;text-shadow:0 0 8px rgba(0,0,0,.8),2px 2px 0 #000;pointer-events:none;white-space:nowrap}
#bust{position:absolute;left:50%;top:62%;transform:translateX(-50%);width:160px;text-align:center;display:none;font-weight:900;font-style:italic;letter-spacing:2px;color:#9cd0ff;text-shadow:0 0 8px #2060ff}
#bustW{height:8px;border:1px solid #9cd0ff;border-radius:4px;margin-top:3px;overflow:hidden;background:rgba(0,0,0,.5)}#bustBar{height:100%;width:0;background:#5ab0ff}
#arrow{position:absolute;left:50%;top:50%;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:26px solid #ff2bd6;filter:drop-shadow(0 0 6px rgba(255,255,255,.8));display:none}
</style>
</head>
<body>
<canvas id="game"></canvas><div class="fx" id="fxVig"></div><div class="fx" id="fxHurt"></div><div class="fx" id="fxFlash"></div><div class="fx" id="fxTint"></div><div class="fx" id="fxBlack"></div>
<div id="hud" class="hud">
  <canvas id="mini" width="236" height="236"></canvas>
  <div id="clock">5:00 PM</div>
  <div id="mission"><div id="mTitle"></div><div id="mObj"></div><div id="mTime"></div></div>
  <div id="topR">
    <div id="cash">$0</div>
    <div id="stars"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div>
    <div id="hpw"><div id="hp"></div></div>
    <div id="tr"><button class="btn" id="bRadio">RADIO</button><button class="btn" id="bMute">♪</button></div>
  </div>
  <div id="toast"></div><div id="arrow"></div><div id="bust">BUSTING<div id="bustW"><div id="bustBar"></div></div></div>
  <div id="big"><div id="bigT"></div><div id="bigS"></div></div>
  <div id="joy"><div id="knob"></div></div>
  <button class="btn" id="bAct">GET IN</button>
  <button class="btn" id="bDrift">DRIFT</button>
  <button class="btn" id="bSprint">RUN</button>
  <div id="help">Left: move · Right: drag to look around · Walk up to a car and tap GET IN</div>
</div>
<div id="title">
  <div id="tBlur"></div><div id="tImg"></div><div id="tShade"></div>
  <div id="tUI"><div id="tap">TAP TO START</div><div id="tSub">3D open world · Missions · Cops · Synthwave radio — best in landscape with sound on</div><div id="tSave"></div></div>
</div>
<div id="rot"><div class="ph"></div><h2>Turn your phone sideways</h2><p>Neon Shore plays best in landscape.</p><button id="rotBtn">Play in portrait anyway</button></div>

function explode(c){c.dead=true;c.deadT=0;c.burn=0;c.vx*=0.3;c.vy*=0.3;c.driver=false;const wasAi=c.ai;c.ai=null;

// ---- car physics
function carPhysics(c,dt){
  const ct=c.ct;const tt=tileW(c.x,c.y);const rough=(tt===SAND||tt===GRASS);
  const dead=c.dead;const thr=dead?0:c.thr,st=dead?0:c.steer,hb=dead?true:c.hb;
  let fx=Math.cos(c.a),fy=Math.sin(c.a);let vf0=c.vx*fx+c.vy*fy;
  const sp=Math.abs(vf0);
  c.a+=(st*ct.turn*clamp(vf0/110,-1,1)*(hb?1.4:1)*(sp>320?0.82:1)+c.spin)*dt;c.spin*=Math.exp(-5*dt);
  fx=Math.cos(c.a);fy=Math.sin(c.a);
  let vf=c.vx*fx+c.vy*fy,vr=-c.vx*fy+c.vy*fx;
  const maxS=ct.max*(rough?0.5:1)*(c.hp<30?0.75:1);
  if(thr>0){if(vf<-5)vf+=ct.acc*1.7*thr*dt;else if(vf<maxS)vf+=ct.acc*thr*dt*(1-Math.max(0,vf)/maxS*0.55);}
  else if(thr<0){if(vf>5)vf+=ct.acc*1.9*thr*dt;else if(vf>-maxS*0.33)vf+=ct.acc*0.6*thr*dt;}
  vf-=vf*((thr===0?0.7:0.12)+(rough?0.8:0))*dt;if(hb)vf-=vf*1.1*dt;if(Math.abs(vf)<2&&thr===0)vf=0;
  const grip=hb?1.5:ct.grip*(rough?0.6:1);vr*=Math.exp(-grip*dt);
  c.vx=fx*vf-fy*vr;c.vy=fy*vf+fx*vr;c.skid=Math.abs(vr);
  c.x+=c.vx*dt;c.y+=c.vy*dt;
  // skids & smoke
  const burnout=thr>0.8&&vf>0&&vf<70&&ct.acc>=290&&c===player.car;
  const skidding=(c.skid>60&&sp>40)||(hb&&sp>70&&!dead)||burnout;
  const rx=-fy,ry=fx,bx=c.x-fx*ct.L*0.32,by=c.y-fy*ct.L*0.32,w=ct.W*0.36;
  const lw=[bx+rx*w,by+ry*w],rw=[bx-rx*w,by-ry*w];
  if(skidding&&c.lw&&onScreen(c.x,c.y,80)){const a=clamp((c.skid+(burnout?80:0))/260,0.15,0.5);addSkid(c.lw[0],c.lw[1],lw[0],lw[1],a);addSkid(c.rw[0],c.rw[1],rw[0],rw[1],a);
    if(Math.random()<0.5)emit('smoke',bx,by,rnd(-15,15)-c.vx*0.1,rnd(-15,15)-c.vy*0.1,rnd(0.6,1.3),rnd(5,9),'#d8d0e0');}
  c.lw=skidding?lw:null;c.rw=skidding?rw:null;c.skidding=skidding;
  // damage smoke / fire
  if(!dead&&c.hp<35&&Math.random()<0.25)emit('smoke',c.x+fx*ct.L*0.35,c.y+fy*ct.L*0.35,rnd(-10,10),rnd(-10,10),rnd(0.8,1.6),rnd(5,10),c.hp<15?'#222':'#999');
  if(c.burn>0){c.burn-=dt;if(Math.random()<0.6)emit('fire',c.x+rnd(-8,8),c.y+rnd(-6,6),rnd(-10,10),rnd(-10,10),rnd(0.3,0.6),rnd(5,10),'#ff7a1a');if(c.burn<=0)explode(c);}
  if(dead){c.deadT+=dt;if(c.deadT<6&&Math.random()<0.3)emit('fire',c.x+rnd(-8,8),c.y+rnd(-6,6),rnd(-8,8),rnd(-8,8),rnd(0.3,0.6),rnd(4,8),'#ff7a1a');if(Math.random()<0.2)emit('smoke',c.x,c.y,rnd(-10,10),rnd(-10,10),rnd(1.5,2.5),rnd(8,14),'#333');}
  carWorld(c);
}
function carWorld(c){const ct=c.ct,r=ct.W/2,off=ct.L/2-r;let fx=Math.cos(c.a),fy=Math.sin(c.a);let tx=0,ty=0,hit=false,torque=0;
  for(const s of[1,-1]){const o={x:c.x+fx*off*s,y:c.y+fy*off*s};const p=pushOut(o,r,solidCar);if(p){c.x+=p.x;c.y+=p.y;tx+=p.x;ty+=p.y;hit=true;torque+=s*off*(fx*p.y-fy*p.x);}}
  if(!hit)return;const l=hyp(tx,ty)||1,nx=tx/l,ny=ty/l,vn=c.vx*nx+c.vy*ny;
  if(vn<0){c.vx-=nx*vn*1.3;c.vy-=ny*vn*1.3;c.vx*=0.9;c.vy*=0.9;const imp=-vn;c.spin+=clamp(torque*imp*0.0009,-3,3);
    if(imp>70){damageCar(c,(imp-70)*0.1);const px=c.x-nx*12,py=c.y-ny*12;for(let i=0;i<Math.min(14,imp/20);i++)emit('spark',px,py,rnd(-1,1)*160+nx*80,rnd(-1,1)*160+ny*80,rnd(0.15,0.4),2,'#ffe28a');
      if(c===player.car){shake(imp/45);SFX.crash(clamp(imp/400,0.2,1));}}}}
function carPairs(){
  for(let i=0;i<cars.length;i++){const a=cars[i];for(let j=i+1;j<cars.length;j++){const b=cars[j];
    if(Math.abs(a.x-b.x)>48||Math.abs(a.y-b.y)>48)continue;
    const ra=a.ct.W/2,rb=b.ct.W/2,oa=a.ct.L/2-ra,ob=b.ct.L/2-rb;const afx=Math.cos(a.a),afy=Math.sin(a.a),bfx=Math.cos(b.a),bfy=Math.sin(b.a);
    let best=null;
    for(const sa of[1,0,-1])for(const sb of[1,0,-1]){const pax=a.x+afx*oa*sa,pay=a.y+afy*oa*sa,pbx=b.x+bfx*ob*sb,pby=b.y+bfy*ob*sb;const d=hyp(pbx-pax,pby-pay),pen=ra+rb-d;
      if(pen>0&&(!best||pen>best.pen))best={pen,d,nx:(pbx-pax)/(d||1),ny:(pby-pay)/(d||1),px:(pax+pbx)/2,py:(pay+pby)/2};}
    if(!best)continue;
    const ma=a.parked&&!a.driver?a.ct.mass*1.5:a.ct.mass,mb=b.parked&&!b.driver?b.ct.mass*1.5:b.ct.mass,tm=ma+mb;
    a.x-=best.nx*best.pen*mb/tm;a.y-=best.ny*best.pen*mb/tm;b.x+=best.nx*best.pen*ma/tm;b.y+=best.ny*best.pen*ma/tm;
    const rv=(b.vx-a.vx)*best.nx+(b.vy-a.vy)*best.ny;if(rv>=0)continue;
    const J=-1.35*rv/(1/ma+1/mb);a.vx-=best.nx*J/ma;a.vy-=best.ny*J/ma;b.vx+=best.nx*J/mb;b.vy+=best.ny*J/mb;
    const imp=-rv;a.spin+=rnd(-1,1)*imp*0.008;b.spin+=rnd(-1,1)*imp*0.008;
    if(imp>45){const d=(imp-45)*0.12;damageCar(a,d*mb/tm*2);damageCar(b,d*ma/tm*2);
      for(let k=0;k<Math.min(16,imp/18);k++)emit('spark',best.px,best.py,rnd(-200,200),rnd(-200,200),rnd(0.15,0.45),2,'#ffe28a');
      const pc=player.car;if(a===pc||b===pc){shake(imp/50);SFX.crash(clamp(imp/380,0.2,1));const o=a===pc?b:a;
        if(o.ai==='police'&&imp>60)addWanted(G.wanted<2?2:Math.min(4,Math.max(G.wanted,G.wanted+0.5)),o);else if(o.driver&&o.ai==='traffic'){o.horn=1.2;if(imp>120)witness(1,o.x,o.y);}}
      else if(onScreen(best.px,best.py,0)&&imp>90)SFX.crash(clamp(imp/600,0.1,0.5));}
  }}}
// ---- people
function makePed(x,y){const d=pick([[1,0],[-1,0],[0,1],[0,-1]]);const p={x,y,dx:d[0],dy:d[1],sp:rnd(26,42),state:'walk',t:0,phase:rnd(TAU),
  shirt:pick(SHIRTS),skin:pick(SKINS),hair:pick(HAIRS),vx:0,vy:0,a:Math.atan2(d[1],d[0]),turnT:rnd(2,7),downT:0,spin:0};peds.push(p);return p;}
function knockPed(p,vx,vy){p.state='down';p.vx=vx;p.vy=vy;p.downT=0;p.spin=rnd(-12,12);SFX.thud();for(let i=0;i<6;i++)emit('spark',p.x,p.y,rnd(-90,90),rnd(-90,90),0.3,2,'#fff6b0');}
function pedUpdate(p,dt){
  if(p.state==='down'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.exp(-3*dt);p.vy*=Math.exp(-3*dt);p.a+=p.spin*dt;p.spin*=Math.exp(-3*dt);p.downT+=dt;const q=pushOut(p,5,solidPed);if(q){p.x+=q.x;p.y+=q.y;p.vx*=-0.4;p.vy*=-0.4;}return;}
  p.t+=dt;
  if(p.state==='flee'){p.t+=0;const s=105;p.x+=Math.cos(p.a)*s*dt;p.y+=Math.sin(p.a)*s*dt;p.phase+=s*dt*0.13;if(p.t>4){p.state='walk';p.t=0;}
    const q=pushOut(p,6,solidPed);if(q){p.x+=q.x;p.y+=q.y;p.a+=rnd(-1.5,1.5);}return;}
  const nx=p.x+p.dx*14,ny=p.y+p.dy*14;p.turnT-=dt;
  if(!pedWalk(tileW(nx,ny))||p.turnT<0){p.turnT=rnd(3,9);const opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(d=>pedWalk(tileW(p.x+d[0]*24,p.y+d[1]*24))&&!(d[0]===-p.dx&&d[1]===-p.dy));
    const d=opts.length?pick(opts):[-p.dx,-p.dy];p.dx=d[0];p.dy=d[1];}
  const ta=Math.atan2(p.dy,p.dx);p.a+=angDiff(ta,p.a)*Math.min(1,dt*8);
  p.x+=p.dx*p.sp*dt;p.y+=p.dy*p.sp*dt;p.phase+=p.sp*dt*0.13;
  const q=pushOut(p,6,solidPed);if(q){p.x+=q.x;p.y+=q.y;}
}
function scare(x,y,r){for(const p of peds){if(p.state==='walk'&&hyp(p.x-x,p.y-y)<r){p.state='flee';p.t=0;p.a=Math.atan2(p.y-y,p.x-x)+rnd(-0.5,0.5);}}}
// person vs car oriented box
function personVsCar(o,r,c){const fx=Math.cos(c.a),fy=Math.sin(c.a);const dx=o.x-c.x,dy=o.y-c.y;const lx=dx*fx+dy*fy,ly=-dx*fy+dy*fx;
  const hx=c.ct.L/2+r,hy=c.ct.W/2+r;if(Math.abs(lx)>=hx||Math.abs(ly)>=hy)return null;const px=hx-Math.abs(lx),py=hy-Math.abs(ly);
  let mx=0,my=0;if(px<py)mx=Math.sign(lx||1)*px;else my=Math.sign(ly||1)*py;return{x:mx*fx-my*fy,y:mx*fy+my*fx};}
function hurtPlayer(d){if(G.state!=='play')return;player.hp-=d;player.hurtT=0.4;shake(d/8);if(player.hp<=0){player.hp=0;die('wrecked');}}
function peopleVsCars(){
  for(const c of cars){const sp=carSpeed(c);if(Math.abs(c.x-player.x)<40&&Math.abs(c.y-player.y)<40&&!player.car){const q=personVsCar(player,6,c);
      if(q){if(sp>95&&!c.dead){hurtPlayer(sp*0.12);player.x+=q.x*2+c.vx*0.08;player.y+=q.y*2+c.vy*0.08;SFX.thud();}else{player.x+=q.x;player.y+=q.y;}}}
    for(const p of peds){if(p.state==='down'||Math.abs(c.x-p.x)>40||Math.abs(c.y-p.y)>40)continue;const q=personVsCar(p,6,c);if(!q)continue;
      if(sp>55){knockPed(p,c.vx*0.9+q.x*5,c.vy*0.9+q.y*5);if(c===player.car){witness(1,p.x,p.y);scare(p.x,p.y,160);}}else{p.x+=q.x;p.y+=q.y;if(p.state==='walk'){p.dx=-p.dx;p.dy=-p.dy;}}}
    if(sp>160&&c===player.car)for(const p of peds)if(p.state==='walk'&&Math.abs(p.x-c.x)<70&&Math.abs(p.y-c.y)<70){p.state='flee';p.t=0;p.a=Math.atan2(p.y-c.y,p.x-c.x);}
  }}
// ---- enter / exit
function nearestCar(r){let b=null,bd=r;for(const c of cars){if(c.dead)continue;const d=hyp(c.x-player.x,c.y-player.y);if(d<bd){bd=d;b=c;}}return b;}
function enterCar(c){
  if(c.driver){const fx=Math.cos(c.a),fy=Math.sin(c.a);const p=makePed(c.x+fy*16,c.y-fx*16);p.state='flee';p.t=0;p.a=Math.atan2(p.y-c.y,p.x-c.x);
    if(c.ai==='police')addWanted(Math.max(2,G.wanted),c);else if(c.ai==='traffic')witness(1,c.x,c.y,0.35);}
  else if(c.type==='police'&&G.wanted<1)addWanted(1,c);
  c.ai=null;c.driver=true;c.parked=false;player.car=c;c.thr=0;c.hb=false;c.steer=0;SFX.door();Radio.onEnter();
}
function exitCar(){const c=player.car;if(!c)return;const fx=Math.cos(c.a),fy=Math.sin(c.a);
  const tries=[[fy,-fx,c.ct.W/2+9],[-fy,fx,c.ct.W/2+9],[fx,fy,c.ct.L/2+9],[-fx,-fy,c.ct.L/2+9]];
  let ok=false;for(const[dx,dy,d]of tries){const x=c.x+dx*d,y=c.y+dy*d;if(!solidPed(tileW(x,y))){player.x=x;player.y=y;ok=true;break;}}
  if(!ok){player.x=c.x;player.y=c.y;}

function onScreen(x,y,m){const dx=x-cam.x,dy=y-cam.y,d=Math.hypot(dx,dy);if(d<180+m)return true;if(d>1300)return false;return Math.abs(angDiff(Math.atan2(dy,dx),cam.yaw))<0.95;}

// ===== AI, wanted, spawning =====
function chooseNext(n,prev,flee){let o=nodes[n].nb.filter(m=>m!==prev);if(!o.length)o=nodes[n].nb;
  if(flee){let b=o[0],bs=-1e9;for(const m of o){const s=hyp(nodes[m].x-player.x,nodes[m].y-player.y)+rnd(0,350);if(s>bs){bs=s;b=m;}}return b;}return pick(o);}
function assignRoute(c){const n=nearestNode(c.x,c.y);const fx=Math.cos(c.a),fy=Math.sin(c.a);
  const N=nodes[n];const ahead=((N.x-c.x)*fx+(N.y-c.y)*fy)>0;
  if(ahead){let b=N.nb[0],bs=-9;for(const m of N.nb){const M=nodes[m];const l=hyp(N.x-M.x,N.y-M.y);const s=((N.x-M.x)*fx+(N.y-M.y)*fy)/l;if(s>bs){bs=s;b=m;}}c.from=b;c.to=n;}
  else{let b=N.nb[0],bs=-9;for(const m of N.nb){const M=nodes[m];const l=hyp(M.x-N.x,M.y-N.y);const s=((M.x-N.x)*fx+(M.y-N.y)*fy)/l;if(s>bs){bs=s;b=m;}}c.from=n;c.to=b;}}
function obstacleAhead(c){if(c.ignoreT>0)return false;const fx=Math.cos(c.a),fy=Math.sin(c.a),range=46+carSpeed(c)*0.22;
  for(const o of cars){if(o===c)continue;const dx=o.x-c.x,dy=o.y-c.y;if(Math.abs(dx)>110||Math.abs(dy)>110)continue;const al=dx*fx+dy*fy;if(al<=0||al>range)continue;if(Math.abs(-dx*fy+dy*fx)<15)return true;}
  if(!player.car){const dx=player.x-c.x,dy=player.y-c.y,al=dx*fx+dy*fy;if(al>0&&al<44&&Math.abs(-dx*fy+dy*fx)<14){c.horn=Math.max(c.horn,0.4);return true;}}
  for(const p of peds){if(p.state==='down')continue;const dx=p.x-c.x,dy=p.y-c.y;if(Math.abs(dx)>60||Math.abs(dy)>60)continue;const al=dx*fx+dy*fy;if(al>0&&al<40&&Math.abs(-dx*fy+dy*fx)<13)return true;}
  return false;}
function drive(c,ad,want){c.steer=clamp(ad*2.4,-1,1);const e=want-carFwd(c);c.thr=e>0?clamp(e/40,0,1):clamp(e/30,-1,0);c.hb=false;}
function trafficAI(c,dt,flee){
  if(c.ignoreT>0)c.ignoreT-=dt;
  if(c.from<0||c.to<0||c.from===c.to)assignRoute(c);
  const A=nodes[c.from],B=nodes[c.to];let ux=B.x-A.x,uy=B.y-A.y;const len=hyp(ux,uy);ux/=len;uy/=len;const rx=-uy,ry=ux;
  const ox=A.x+rx*LANE,oy=A.y+ry*LANE;const s=(c.x-ox)*ux+(c.y-oy)*uy,lat=(c.x-ox)*rx+(c.y-oy)*ry;
  if(Math.abs(lat)>100||s<-140||s>len+140){assignRoute(c);return;}
  if(s>len-LANE-6){const p=c.from;c.from=c.to;c.to=chooseNext(c.to,p,flee);return;}
  const look=32+carSpeed(c)*0.22;const tx=ox+ux*(s+look),ty=oy+uy*(s+look);
  const ad=angDiff(Math.atan2(ty-c.y,tx-c.x),c.a);let want=c.cruise;
  if(Math.abs(ad)>0.35)want*=0.5;if(!flee&&len-s<120&&c.type!=='police')want=Math.min(want,90);
  if(!flee&&obstacleAhead(c)){want=0;c.brakeT+=dt;if(c.brakeT>1.5)c.horn=Math.max(c.horn,0.3);}else c.brakeT=0;
  if(c.brakeT>3.5){c.ignoreT=1.6;c.brakeT=0;}
  if(flee){if(c.revT>0){c.revT-=dt;c.thr=-1;c.steer=-Math.sign(ad);c.hb=false;return;}if(carSpeed(c)<18){c.stuckT+=dt;if(c.stuckT>1){c.revT=0.8;c.stuckT=0;}}else c.stuckT=0;}
  drive(c,ad,want);
}
function policeAI(c,dt){

  const P=player.car||player,pvx=player.car?player.car.vx:player.vx,pvy=player.car?player.car.vy:player.vy;
  const d=hyp(P.x-c.x,P.y-c.y);let tx,ty;const see=d<400&&los(c.x,c.y,P.x,P.y);c.sees=see;
  if(see){const lead=player.car?clamp(d/320,0,0.7):0.2;tx=P.x+pvx*lead;ty=P.y+pvy*lead;c.nav=-1;}
  else{
    if(c.nav<0){let b=-1,bd=1e18;for(let k=0;k<nodes.length;k++){const n=nodes[k],dd=(n.x-c.x)**2+(n.y-c.y)**2;if(dd<bd&&los(c.x,c.y,n.x,n.y)){bd=dd;b=k;}}c.nav=b<0?nearestNode(c.x,c.y):b;}
    else if(hyp(nodes[c.nav].x-c.x,nodes[c.nav].y-c.y)<50){let b=c.nav,bd=1e18;for(const m of nodes[c.nav].nb){const dd=hyp(nodes[m].x-P.x,nodes[m].y-P.y);if(dd<bd){bd=dd;b=m;}}c.nav=b;}

function updatePlayer(dt){const kx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),ky=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);

function hud(dt){hudT-=dt;if(hudT>0)return;hudT=0.1;drawMini();const set=(k,v,fn)=>{if(lastHud[k]!==v){lastHud[k]=v;fn(v);}};

function adapt(fps){const t=POST.tier;
  if(fps<30){if(t==='high')setTier('med');else if(t==='med'){if(resScale>0.8){resScale=0.8;resize();}else setTier('low');}else if(t==='low'){if(resScale>0.65){resScale=0.65;resize();}else setTier('min');}else if(resScale>0.55){resScale=0.55;resize();}goodN=0;}
  else if(fps<42&&resScale>0.7){resScale=Math.max(0.7,resScale-0.1);resize();goodN=0;}
  else if(fps>57&&resScale<1){if(++goodN>=3){resScale=Math.min(1,resScale+0.1);resize();goodN=0;}}}
